[project]
name = "esplink"
version = "2.0.0"
description = "Control every ESP32 peripheral from Python over USB serial or Bluetooth — GPIO, ADC, DAC, PWM, touch, I2C, SPI, UART, Wi-Fi sockets, BLE, ESP-NOW, RMT, 1-Wire, CAN, I2S, files, NVS, OTA"
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "HamzaYslmn" }]
keywords = ["esp32", "raspberry-pi", "gpio", "serial", "bridge", "firmata", "i2c", "spi", "ble", "espnow"]
dependencies = [
    "bleak>=3.0.2",
    "pyserial>=3.5",
]

[project.optional-dependencies]
oled = ["pillow>=13"]  # esplink.oled: PIL drawing for SSD1306/SH1106 displays
mcp = ["fastmcp>=4.1"]  # esplink.mcp: MCP server exposing the bridge as tools
flash = ["esptool>=5.6"]  # esplink flash / `flash`: write the bundled firmware over USB serial
all = ["esplink[oled,mcp,flash]"]  # every optional feature at once

[project.urls]
Homepage = "https://github.com/HamzaYslmn/esplink"

[project.scripts]
esplink = "esplink.cli:main"
esplink-mcp = "esplink.mcp.server:main"
flash = "esplink.flash:main"  # `uvx --from "esplink[flash]" flash`

# Third-party device drivers: a package advertises its driver classes in this
# group and they become available as esp.<name>(...) on every bridge, with no
# import or register_driver() call. See docs/DRIVERS.md.
#   [project.entry-points."esplink.drivers"]
#   mydevice = "my_package.module:MyDriver"

[dependency-groups]
dev = ["pytest>=9.1", "pillow>=13", "gpiozero>=2.0.1", "fastmcp>=4.1"]

[build-system]
requires = ["hatchling>=1.32"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["esplink"]
# The prebuilt firmware image is .gitignored (regenerated by CI /
# tools/build_firmware.py), so force it into the wheel anyway.
artifacts = ["esplink/firmware/*.bin"]

[tool.hatch.build.targets.sdist]
artifacts = ["esplink/firmware/*.bin"]
