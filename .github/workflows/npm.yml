name: Publish npm

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  # MARK: - Publish to npm on tag push (trusted publishing via OIDC, provenance is automatic)
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24   # ships npm 11, which trusted publishing needs (>= 11.5.1)
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Run tests
        run: node --test

      - name: Publish
        run: npm publish
