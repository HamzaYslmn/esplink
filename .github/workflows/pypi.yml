name: Build & Publish

on:
  push:
    tags:
      - "v*.*.*"
  pull_request:

jobs:
  # MARK: - Build sdist + universal wheel
  # esplink is pure-Python, so one `py3-none-any` wheel covers every platform.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2   # no moving major tag for this action

      # MARK: - Build the bundled firmware images (ESP32, ESP32-S3, Pro Micro) shipped in the wheel
      - uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 + Seeed nRF52 cores
        env:
          URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json,https://files.seeedstudio.com/arduino/package_seeeduino_boards_index.json
        run: |
          arduino-cli core update-index --additional-urls "$URLS"
          arduino-cli core install esp32:esp32@3.3.12 Seeeduino:nrf52@1.1.13 --additional-urls "$URLS"

      # The nRF52 core packages every build with adafruit-nrfutil, and ships it for Windows/macOS only
      - name: Install adafruit-nrfutil
        run: uv tool install adafruit-nrfutil

      - name: Build firmware images
        run: |
          uv run --no-project python tools/build_firmware.py

      - name: Build sdist + wheel
        working-directory: python
        run: uv build -o ../dist/dist-build

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/dist-build/*

      - name: Clean local build folder
        run: rm -rf dist/dist-build

  # MARK: - Publish to PyPI on tag push (trusted publishing via OIDC)
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    # Triggered only by v*.*.* tags (see `on.push.tags` above).
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/dist-build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/dist-build
